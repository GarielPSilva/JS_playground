<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro</title>
    <link rel="stylesheet" href="financeiro.css">
</head>
<body>
    <form id="formulario">
        <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" name="descricao">
        <label for="valor">Valor:</label>
            <input type="number" id="valor" name="valor" step="0.01">
        <label for="tipo">Tipo:</label>
        <select name="tipo" id="tipo">
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
        </select>
        <label for="categoria">Categoria:</label>
        <select name="categoria" id="categoria">
            <option value="salario">Salário</option>
            <option value="vale_transporte">Vale Transporte</option>
            <option value="alimentacao">Alimentação</option>
            <option value="lazer">Lazer</option>
            <option value="outros">Outros</option>
        </select>
        <button type="submit" id="adicionar">Adicionar</button>
    </form>
    <div class="conteudo">
        <section id="lista-transacoes">
            <h2>Transações</h2>
            <ul id="transacoes"></ul>
            <div class="resumo">
                <div class="resumo-linha">
                    <span>Entradas</span>
                    <strong id="total-entradas">R$ 0,00</strong>
                </div>
                <div class="resumo-linha">
                    <span>Saídas</span>
                    <strong id="total-saidas">R$ 0,00</strong>
                </div>
                <div class="resumo-linha resumo-total">
                    <span>Valor total</span>
                    <strong id="total-geral">R$ 0,00</strong>
                </div>
            </div>
            <form id="form-investimento">
                <label for="investimento">Valor a investir em <span id="investimento-mes"></span></label>
                <div class="investimento-campo">
                    <input type="number" id="investimento" step="0.01" placeholder="0,00">
                    <button type="submit" id="investir">Investir</button>
                </div>
            </form>
        </section>
        <section id="grafico">
            <div class="grafico-topo">
                <button type="button" id="mes-anterior" aria-label="Mês anterior">&#8249;</button>
                <h2 id="mes-atual"></h2>
                <button type="button" id="mes-posterior" aria-label="Próximo mês">&#8250;</button>
            </div>
            <div id="colunas" class="colunas"></div>
        </section>
    </div>
    <script src="financeiro.js"></script>
</body>
</html>
